version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: govflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-govflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-govflow_secure_2026}
      POSTGRES_DB: ${DB_NAME:-govflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-govflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - govflow-network

  redis:
    image: redis:7-alpine
    container_name: govflow-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-govflow_redis_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-govflow_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - govflow-network

  minio:
    image: minio/minio:latest
    container_name: govflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-govflow_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-govflow_minio_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - govflow-network

  clamav:
    image: clamav/clamav-debian:stable
    container_name: govflow-clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - govflow-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:

networks:
  govflow-network:
    driver: bridge
